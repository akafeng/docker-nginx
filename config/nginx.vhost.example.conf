server {
    listen 80;
    listen [::]:80;

    server_name example.tld;

    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme/;
        default_type "text/plain";
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    listen 443 quic;
    listen [::]:443 quic;

    http2 on;
    http3 on;

    server_name example.tld;

    access_log /var/log/nginx/example.tld.log main buffer=64k flush=5s;

    ssl_certificate /etc/nginx/ssl/example.tld.crt;
    ssl_certificate_key /etc/nginx/ssl/example.tld.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:P-256;

    ssl_prefer_server_ciphers on;
    ssl_conf_command Options PrioritizeChaCha;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';

    ssl_buffer_size 16k;

    ssl_dyn_rec_enable on;
    ssl_dyn_rec_threshold 10;
    ssl_dyn_rec_timeout 2000ms;

    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    ssl_session_tickets off;
    ssl_early_data off;

    # ssl_verify_client on;
    # ssl_client_certificate /etc/nginx/ssl/origin_ca.crt;

    quic_gso on;
    quic_retry on;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 10s;

    proxy_hide_header Alt-Svc;
	add_header Alt-Svc 'h3=":$server_port"; ma=86400' always;

    location / {
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;

        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass http://server;
    }
}
